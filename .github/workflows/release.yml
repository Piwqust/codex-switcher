name: release

# Push a tag like v1.0.0. The release notes come from that version's section in CHANGELOG.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

      - name: Build
        shell: cmd
        run: build.cmd ${{ matrix.arch }} dist\CodexAccountSwitcher-${{ matrix.arch }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.arch }}
          path: dist/CodexAccountSwitcher-${{ matrix.arch }}.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package and write release notes
        id: notes
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          $version = $tag.TrimStart('v')
          Set-Location dist

          $pkg = New-Item -ItemType Directory "CodexAccountSwitcher-$version"
          Copy-Item CodexAccountSwitcher-x64.exe, CodexAccountSwitcher-arm64.exe $pkg
          Copy-Item ../LICENSE, ../README.md, ../README.ru.md, ../CHANGELOG.md $pkg
          Copy-Item ../docs/*.md (New-Item -ItemType Directory "$pkg/docs")
          Compress-Archive -Path "$pkg/*" -DestinationPath "CodexAccountSwitcher-$version-windows.zip"

          $files = 'CodexAccountSwitcher-x64.exe', 'CodexAccountSwitcher-arm64.exe', "CodexAccountSwitcher-$version-windows.zip"
          $sums = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f }
          $sums | Set-Content SHA256SUMS.txt -Encoding ascii

          $log = Get-Content ../CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)")
          $changes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$tag/CHANGELOG.md)." }
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          # Pinned to the tag, so an old release keeps the picture of its own version.
          $shot = "https://raw.githubusercontent.com/${{ github.repository }}/$tag/docs/images/picker-dark.png"

          @"
          <p align="center"><img src="$shot" alt="Codex Account Switcher $version" width="720"></p>

          $changes

          ## Download

          | Your PC | File |
          | --- | --- |
          | Intel or AMD (almost every PC) | [CodexAccountSwitcher-x64.exe]($base/CodexAccountSwitcher-x64.exe) |
          | ARM: Snapdragon, Surface Pro X | [CodexAccountSwitcher-arm64.exe]($base/CodexAccountSwitcher-arm64.exe) |

          Run the exe: it installs itself, or updates your copy with accounts and settings kept. Installed copies offer the update by themselves. It isn't code-signed, so Windows may ask: **More info → Run anyway**. ``SHA256SUMS.txt`` lists the checksums; the zip holds both exes with the documentation.
          "@ -replace '(?m)^          ', '' | Set-Content release-notes.md -Encoding utf8

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Codex Account Switcher ${{ steps.notes.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            dist/CodexAccountSwitcher-x64.exe
            dist/CodexAccountSwitcher-arm64.exe
            dist/CodexAccountSwitcher-${{ steps.notes.outputs.version }}-windows.zip
            dist/SHA256SUMS.txt
          make_latest: true
